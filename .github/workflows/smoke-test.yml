name: Smoke Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke-test:
    name: Run backend smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run smoke tests
        run: node scripts/smoke-test.js

      - name: Check deployment config
        run: node scripts/check-deployment-config.js
